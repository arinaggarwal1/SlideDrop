name: Build desktop apps

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: SlideDrop-macOS
            path: |
              dist/SlideDrop.app
              dist/SlideDrop.dmg
          - name: Windows
            os: windows-2022
            artifact: SlideDrop-Windows
            path: |
              dist/SlideDrop-Windows.zip
              dist/SlideDrop-Setup.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0.x"
      - name: Install macOS packaging dependency
        if: runner.os == 'macOS'
        run: brew install create-dmg
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Test updater
        # Run the actual macOS architecture command as part of the regression suite.
        run: python -m unittest discover -s backend/tests -p test_updater.py -v
      - name: Package native app
        run: python build.py
      - name: Test Windows MSI install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\SlideDrop-Setup.msi").Path
          $installLog = Join-Path $PWD "build\msi-install.log"
          $uninstallLog = Join-Path $PWD "build\msi-uninstall.log"

          $install = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart", "/L*v", "`"$installLog`"") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content $installLog
            throw "MSI install failed with exit code $($install.ExitCode)"
          }

          $installedFiles = @(
            "$env:ProgramFiles\SlideDrop\SlideDrop.exe",
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\SlideDrop\SlideDrop.lnk",
            "$env:Public\Desktop\SlideDrop.lnk"
          )
          foreach ($path in $installedFiles) {
            if (-not (Test-Path $path)) {
              throw "Expected installed item was not found: $path"
            }
          }

          $uninstall = Start-Process msiexec.exe `
            -ArgumentList @("/x", "`"$msi`"", "/qn", "/norestart", "/L*v", "`"$uninstallLog`"") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Get-Content $uninstallLog
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
          }

          foreach ($path in $installedFiles) {
            if (Test-Path $path) {
              throw "MSI uninstall left an installed item behind: $path"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
