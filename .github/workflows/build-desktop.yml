name: Build desktop apps

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            artifact: SlideDrop-macOS
            path: |
              dist/SlideDrop.app
              dist/SlideDrop.dmg
          - name: Windows
            os: windows-2022
            artifact: SlideDrop-Windows
            path: dist/SlideDrop-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install macOS packaging dependency
        if: runner.os == 'macOS'
        run: brew install create-dmg
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller
      - name: Build native app
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

